<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buyers.co - Food & Grocery</title>
    <link rel="stylesheet" href="my project.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">buyers<span>.co</span></div>
        <input type="text" class="search" placeholder="Search for groceries or food...">
        <button class="cart">Cart (0)</button>
    </nav>

    <main class="container">
        <!-- Hero Section -->
        <section class="modes">
            <div class="mode-card grocery">
                <h2>Grocery in 10 mins</h2>
                <button>Shop Now</button>
            </div>
            <div class="mode-card food">
                <h2>Top Restaurants</h2>
                <button>Order Food</button>
            </div>
        </section>

        <!-- Grocery Categories -->
        <section class="section">
            <h3 class="section-title">Quick Groceries</h3>
            <div class="grid categories-grid">
                <div class="card cat-card">🥕 Vegetables</div>
                <div class="card cat-card">🥛 Dairy</div>
                <div class="card cat-card">🍿 Snacks</div>
                <div class="card cat-card">🥩 Meat</div>
                <div class="card cat-card">💊 Pharmacy</div>
                <div class="card cat-card">📱 Electronics</div>
            </div>
        </section>

        <!-- Food Delivery -->
        <section class="section">
            <h3 class="section-title">Food Delivery</h3>
            <div class="grid restaurants-grid">
                <div class="card res-card">
                    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400&h=250&fit=crop" alt="Pizza">
                    <div class="p-4">
                        <h4>La Pino'z Pizza</h4>
                        <p class="text-gray">Pizza, Fast Food • 25 mins</p>
                    </div>
                </div>
                <div class="card res-card">
                    <img src="https://images.unsplash.com/photo-1585032226651-759b368d7246?w=400&h=250&fit=crop" alt="Burger">
                    <div class="p-4">
                        <h4>Burger King</h4>
                        <p class="text-gray">Burgers, American • 15 mins</p>
                    </div>
                </div>
                <div class="card res-card">
                    <img src="https://images.unsplash.com/photo-1589302168068-964664d93cb0?w=400&h=250&fit=crop" alt="Biryani">
                    <div class="p-4">
                        <h4>Behrouz Biryani</h4>
                        <p class="text-gray">Biryani, North Indian • 30 mins</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 buyers.co</p>
    </footer>
</body>
</html>
