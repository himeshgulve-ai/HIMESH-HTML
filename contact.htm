<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body STYLE ="background-color: black;">
    <h1 ALIGN="center" STYLE="color:red;">MY WEBSITE</h1>
    <HR>
    <H2 ALIGN="center" STYLE="color:red;">ZAMATO</H2>  
    <H3>ENTER DETAILS:</H3>
    <form sTYLE="background-color: lightgray;" ALIGN="LEFT">
        <LABEL for="name">NAME:</LABEL><BR>
        <INPUT TYPE="TEXT" ID="name" NAME="name"><BR><BR>
        <LABEL for="email">EMAIL:</LABEL><BR>
        <INPUT TYPE="EMAIL" ID="email" NAME="email"><BR><BR>
        <LABEL for="address">ADDRESS:</LABEL><BR>
        <TEXTAREA ID="address" NAME="address" ROWS="5" COLS="20"></TEXTAREA><BR><BR>
            <label for="phone">PHONE NO:</label><BR>
            <INPUT TYPE="TEXT" ID="phone" NAME="phone"><BR><BR>
        <LABEL for="pin">PIN CODE:</LABEL><BR>
            <INPUT TYPE="TEXT" ID="pin" NAME="pin"><BR><BR>
        <LABEL for="message">MESSAGE FOR RIDER:</LABEL><BR>
        <TEXTAREA ID="message" NAME="message" ROWS="5" COLS="20"></TEXTAREA><BR><BR>
            <label for="payment">PAYMENT METHOD:</label><BR>
            <SELECT ID="payment" NAME="payment">
                <OPTION VALUE="cash">CASH</OPTION>
                <OPTION VALUE="card">CARD</OPTION>
                <OPTION VALUE="upi">UPI</OPTION>
            </SELECT><BR><BR>   


        <BR><BR>
        <INPUT TYPE="RESET" VALUE="RESET"><BR>
        <INPUT TYPE="SUBMIT" VALUE="SUBMIT"><BR><BR>

    </form>
</body>

</html>
